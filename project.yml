name: QQQMBar
options:
  bundleIdPrefix: com.lyh
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 26.0
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: QQQMBar/Info.plist
targets:
  QQQMBar:
    type: application
    platform: macOS
    sources:
      - path: QQQMBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyh.qqqmbar
        PRODUCT_NAME: QQQMBar
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: QQQMBar/QQQMBar.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: 0.21.0
        CURRENT_PROJECT_VERSION: 47
